name: Radar - skills e prompts

on:
  push:
    branches: [main, feat/radar-de-estudos-skills]
    paths:
      - '.agents/skills/**'
      - 'estudos-concursos/**'
      - '.github/workflows/radar-skills.yml'
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'estudos-concursos/**'
      - '.github/workflows/radar-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar validador YAML
        run: python3 -m pip install -r estudos-concursos/requirements-validacao.txt
      - name: Conferir skills, invocação implícita, prompts e links
        run: python3 estudos-concursos/scripts/validar_radar.py
      - name: Testar regressões da automação
        run: python3 -m unittest discover -s estudos-concursos/tests -v
