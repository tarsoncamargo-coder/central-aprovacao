let quizRuntime={items:[],index:0,answers:{},revealed:{},mode:'practice',title:'',source:'all'};

function normalizeQuestion(q,meta={}){
 let options=(q.options||[]).map(x=>String(x));
 let correct=String(q.correct||'').trim().toUpperCase();
 if(!correct && q.a && options.length){
  let pos=options.findIndex(o=>o.replace(/^[A-E][\)\.\-:]\s*/i,'').trim().toLowerCase()===String(q.a).trim().toLowerCase());
  if(pos>=0)correct=String.fromCharCode(65+pos);
 }
 return {...q,options,correct,courseId:meta.courseId,courseName:meta.courseName,subjectId:meta.subjectId,subjectName:meta.subjectName,moduleId:meta.moduleId,moduleTitle:meta.moduleTitle,origin:meta.origin||'questions'};
}
function allBankQuestions(includeSimulation=true){
 let out=[];
 (data.studyCourses||[]).forEach(c=>(c.subjects||[]).forEach(s=>(s.modules||[]).forEach(m=>{
  if(m.pack){
   (m.pack.questions||[]).forEach(q=>out.push(normalizeQuestion(q,{courseId:c.id,courseName:c.name,subjectId:s.id,subjectName:s.name,moduleId:m.id,moduleTitle:m.title,origin:'questions'})));
   if(includeSimulation)(m.pack.simulation||[]).forEach(q=>out.push(normalizeQuestion(q,{courseId:c.id,courseName:c.name,subjectId:s.id,subjectName:s.name,moduleId:m.id,moduleTitle:m.title,origin:'simulation'})));
  }
 })));
 return out;
}
function attemptsFor(q){return (data.questionAttempts||[]).filter(a=>a.moduleId===q.moduleId && a.questionId===(q.id||q.q))}
function latestAttempt(q){let a=attemptsFor(q);return a[a.length-1]||null}
function isFavorite(q){return (data.quizFavorites||[]).includes(`${q.moduleId}::${q.id||q.q}`)}
function toggleFavorite(q){
 let k=`${q.moduleId}::${q.id||q.q}`,i=data.quizFavorites.indexOf(k);
 if(i>=0)data.quizFavorites.splice(i,1);else data.quizFavorites.push(k);save();renderBanco()
}
function moduleBankStats(moduleId){
 let qs=allBankQuestions(true).filter(q=>q.moduleId===moduleId), ats=(data.questionAttempts||[]).filter(a=>a.moduleId===moduleId);
 let ok=ats.filter(a=>a.correct).length;
 return {questions:qs.length,attempts:ats.length,accuracy:pct(ok,ats.length),wrong:ats.filter(a=>!a.correct).length}
}
function startQuiz(filter='all',count=10,mode='practice'){
 let items=allBankQuestions(true);
 if(filter==='wrong'){
  let wrongKeys=new Set((data.questionAttempts||[]).filter(a=>!a.correct).map(a=>`${a.moduleId}::${a.questionId}`));
  items=items.filter(q=>wrongKeys.has(`${q.moduleId}::${q.id||q.q}`));
 }else if(filter==='favorites'){
  let fav=new Set(data.quizFavorites||[]);items=items.filter(q=>fav.has(`${q.moduleId}::${q.id||q.q}`));
 }else if(filter.startsWith('module:')){
  let mid=filter.slice(7);items=items.filter(q=>q.moduleId===mid);
 }else if(filter.startsWith('subject:')){
  let sid=filter.slice(8);items=items.filter(q=>q.subjectId===sid);
 }else if(filter.startsWith('course:')){
  let cid=filter.slice(7);items=items.filter(q=>q.courseId===cid);
 }
 if(!items.length)return alert('Ainda não há questões disponíveis para esse filtro.');
 items=items.sort(()=>Math.random()-.5).slice(0,Math.min(+count||10,items.length));
 quizRuntime={items,index:0,answers:{},revealed:{},mode,title:mode==='simulation'?'Simulado':'Sessão de questões',source:filter};
 renderQuizRunner();
}
function answerQuestion(letter){
 let q=quizRuntime.items[quizRuntime.index];if(!q)return;
 quizRuntime.answers[quizRuntime.index]=letter;
 if(quizRuntime.mode==='practice')submitCurrentAnswer();
 else renderQuizRunner();
}
function submitCurrentAnswer(){
 let i=quizRuntime.index,q=quizRuntime.items[i],ans=quizRuntime.answers[i];if(!ans)return alert('Selecione uma alternativa.');
 if(quizRuntime.revealed[i])return;
 let correct=q.correct?ans===q.correct:false;
 quizRuntime.revealed[i]=true;
 data.questionAttempts.push({date:new Date().toISOString(),courseId:q.courseId,subjectId:q.subjectId,moduleId:q.moduleId,questionId:q.id||q.q,answer:ans,correct,correctAnswer:q.correct||q.a||'',topic:q.topic||'',mode:quizRuntime.mode});
 saveNoRender();
 renderQuizRunner();
}

function saveNoRender(skipTimestamp=false){
 if(!skipTimestamp){
   if(!data._meta)data._meta={};
   data._meta.updatedAt=new Date().toISOString();
   data._meta.device=getDeviceLabel();
 }
 localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
 if(!skipTimestamp)scheduleCloudSync();
}

function nextQuiz(){if(quizRuntime.index<quizRuntime.items.length-1){quizRuntime.index++;renderQuizRunner()}else finishQuiz()}
function prevQuiz(){if(quizRuntime.index>0){quizRuntime.index--;renderQuizRunner()}}
function goQuiz(i){quizRuntime.index=i;renderQuizRunner()}
function finishQuiz(){
 if(quizRuntime.mode==='simulation'){
  quizRuntime.items.forEach((q,i)=>{
   let ans=quizRuntime.answers[i];if(!ans)return;
   if(!quizRuntime.revealed[i]){
    let correct=q.correct?ans===q.correct:false;
    quizRuntime.revealed[i]=true;
    data.questionAttempts.push({date:new Date().toISOString(),courseId:q.courseId,subjectId:q.subjectId,moduleId:q.moduleId,questionId:q.id||q.q,answer:ans,correct,correctAnswer:q.correct||q.a||'',topic:q.topic||'',mode:'simulation'});
   }
  });
  saveNoRender();
 }
 let answered=Object.keys(quizRuntime.answers).length;
 let correct=quizRuntime.items.reduce((n,q,i)=>n+(quizRuntime.answers[i] && (q.correct?quizRuntime.answers[i]===q.correct:false)?1:0),0);
 let total=quizRuntime.items.length, acc=pct(correct,total);
 if(quizRuntime.mode==='simulation'){
  data.mocks.push({name:`Simulado do Banco — ${new Date().toLocaleDateString('pt-BR')}`,exam:'Banco de Questões da Central',qty:total,hits:correct,minutes:0,date:today(),notes:`Fonte: ${quizRuntime.source}`});
  saveNoRender();
 }
 $('banco').innerHTML=`<div class="card"><span class="badge good">Sessão concluída</span><h2 style="margin-top:10px">${quizRuntime.title}</h2><div class="metrics"><div class="metric"><span>Questões</span><strong>${total}</strong></div><div class="metric"><span>Respondidas</span><strong>${answered}</strong></div><div class="metric"><span>Acertos</span><strong>${correct}</strong></div><div class="metric"><span>Aproveitamento</span><strong>${acc}%</strong></div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="renderBanco()">Voltar ao banco</button><button class="btn alt" onclick="startQuiz('wrong',10,'practice')">Refazer erradas</button></div></div>`;
}
function sendToErrorBook(q){
 let last=latestAttempt(q);
 let errText=`Questão: ${q.q}${last?` | Minha resposta: ${last.answer}`:''}`;
 if(!data.errors.some(e=>e.originQuestionId===(q.id||q.q)&&e.moduleId===q.moduleId)){
  data.errors.push({date:today(),subject:q.subjectName||'',topic:q.topic||q.moduleTitle||'',error:errText,correct:`Gabarito: ${q.correct||q.a||''}. ${q.explanation||''}`,cause:'Conteúdo',reviewed:false,originQuestionId:q.id||q.q,moduleId:q.moduleId});
  saveNoRender();alert('Questão enviada ao Caderno de Erros.');
 }else alert('Essa questão já está no Caderno de Erros.');
}
function renderQuizRunner(){
 let q=quizRuntime.items[quizRuntime.index],i=quizRuntime.index,ans=quizRuntime.answers[i],revealed=!!quizRuntime.revealed[i];
 let optionHtml='';
 if(q.options?.length){
  optionHtml=q.options.map((o,idx)=>{
   let letter=String.fromCharCode(65+idx),cls=ans===letter?' selected':'';
   if(revealed){if(letter===q.correct)cls+=' correct';else if(ans===letter && ans!==q.correct)cls+=' wrong'}
   return `<button class="quiz-option${cls}" onclick="answerQuestion('${letter}')"><span class="quiz-letter">${letter}</span><span>${esc(o.replace(/^[A-E][\)\.\-:]\s*/i,''))}</span></button>`
  }).join('');
 }else{
  optionHtml=`<div class="ai-note">Esta questão veio de um pacote antigo sem alternativas interativas.</div><button class="btn" onclick="quizRuntime.revealed[${i}]=true;renderQuizRunner()">Revelar resposta</button>`;
 }
 let explanation=revealed?`<div class="explanation"><b>${q.correct?((ans===q.correct?'✅ Correto':'❌ Incorreto')+' — Gabarito '+q.correct):'Resposta'}</b><p>${esc(q.a||'')}</p><p>${esc(q.explanation||'')}</p>${ans!==q.correct?`<button class="btn ghost" onclick='sendToErrorBook(quizRuntime.items[${i}])'>Enviar ao Caderno de Erros</button>`:''}</div>`:'';
 let dots=quizRuntime.items.map((x,j)=>{let cls=j===i?' current':'';if(quizRuntime.revealed[j])cls+=(quizRuntime.answers[j]===x.correct?' ok':' bad');return `<button class="quiz-dot${cls}" onclick="goQuiz(${j})">${j+1}</button>`}).join('');
 $('banco').innerHTML=`<div class="quiz-shell"><div class="card">
 <div class="row spread"><div><span class="badge">${quizRuntime.mode==='simulation'?'🧪 Simulado':'📝 Treino'}</span><div class="path-chip">${esc(q.courseName)} › ${esc(q.subjectName)} › ${esc(q.moduleTitle)} ${q.topic?'› '+esc(q.topic):''}</div></div><button class="btn ghost" onclick='toggleFavorite(quizRuntime.items[${i}])'>${isFavorite(q)?'★ Favorita':'☆ Favoritar'}</button></div>
 <div class="quiz-question">${i+1}. ${esc(q.q)}</div>${optionHtml}
 ${quizRuntime.mode==='simulation'?'':(!revealed&&q.options?.length?'<button class="btn" onclick="submitCurrentAnswer()">Corrigir</button>':'')}
 ${explanation}
 <div class="row spread" style="margin-top:16px"><button class="btn ghost" onclick="prevQuiz()" ${i===0?'disabled':''}>← Anterior</button><span class="muted">${i+1}/${quizRuntime.items.length}</span><button class="btn" onclick="nextQuiz()">${i===quizRuntime.items.length-1?'Finalizar':'Próxima →'}</button></div>
 </div><div class="card"><h3>Navegação</h3><div class="quiz-nav">${dots}</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="small muted">${quizRuntime.mode==='simulation'?'No simulado, a correção aparece somente ao finalizar.':'No treino, cada questão é corrigida imediatamente.'}</div><button class="btn alt" style="margin-top:12px;width:100%" onclick="finishQuiz()">Encerrar sessão</button></div></div>`
}
function renderBanco(){
 ensureDemoQuestionPack();
 let all=allBankQuestions(true), attempts=data.questionAttempts||[], correct=attempts.filter(x=>x.correct).length;
 let modules=[];
 (data.studyCourses||[]).forEach(c=>(c.subjects||[]).forEach(s=>(s.modules||[]).forEach(m=>{

 $('banco').innerHTML=`<div class="metrics"><div class="metric"><span>Questões disponíveis</span><strong>${all.length}</strong></div><div class="metric"><span>Tentativas</span><strong>${attempts.length}</strong></div><div class="metric"><span>Acertos</span><strong>${correct}</strong></div><div class="metric"><span>Aproveitamento</span><strong>${pct(correct,attempts.length)}%</strong></div></div>

}

// ==================== V7: Login e sincronização ====================
let sb=null, currentUser=null, syncTimer=null, syncBusy=false;

function getDeviceLabel(){
 const ua=navigator.userAgent||'';
 if(/iPhone|iPad|iPod/i.test(ua))return 'iPhone/iPad';
 if(/Android/i.test(ua))return 'Android';
 if(/Windows/i.test(ua))return 'Windows';
 if(/Mac/i.test(ua))return 'Mac';
 return 'Navegador';
}
function getSupabaseConfig(){
 const globalCfg=window.CENTRAL_SUPABASE||{};
 const saved=JSON.parse(localStorage.getItem('centralSupabaseConfig')||'{}');
 return {
   url:(globalCfg.url||saved.url||'').trim(),
   anonKey:(globalCfg.anonKey||saved.anonKey||'').trim()
 };
}
function isConfigReady(){
 const c=getSupabaseConfig();
 return /^https:\/\/.+\.supabase\.co$/i.test(c.url) && c.anonKey.length>20;
}
async function initSupabase(){
 if(!window.supabase || !isConfigReady())return false;
 try{
   const c=getSupabaseConfig();
   sb=window.supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   const {data:{session}}=await sb.auth.getSession();
   currentUser=session?.user||null;
   sb.auth.onAuthStateChange((_event,session)=>{
     currentUser=session?.user||null;
     if(currentUser){
       if(!data.cloudSync)data.cloudSync={};
       data.cloudSync.enabled=true;
       localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
       setTimeout(()=>smartInitialSync(),200);
     }
     renderConta();
   });
   return true;
 }catch(e){
   if(!data.cloudSync)data.cloudSync={};
   data.cloudSync.lastError=e.message;
   return false;
 }
}
function saveSupabaseConfig(){
 const url=val('sb_url').trim(),anonKey=val('sb_key').trim();
 if(!url||!anonKey)return alert('Preencha a URL do projeto e a chave anon/public.');
 localStorage.setItem('centralSupabaseConfig',JSON.stringify({url,anonKey}));
 alert('Configuração salva neste aparelho. Vou inicializar a conexão.');
 location.reload();
}
function clearSupabaseConfig(){
 if(!confirm('Remover a configuração do Supabase deste aparelho?'))return;
 localStorage.removeItem('centralSupabaseConfig');
 location.reload();
}
async function signUpCentral(){
 if(!sb)return alert('Configure o Supabase primeiro.');
 const email=val('auth_email').trim(),password=val('auth_password');
 if(!email||password.length<6)return alert('Informe e-mail e uma senha com pelo menos 6 caracteres.');
 const {data:res,error}=await sb.auth.signUp({email,password});
 if(error)return alert('Não foi possível criar a conta: '+error.message);
 alert(res.session?'Conta criada e conectada.':'Conta criada. Confira seu e-mail se o projeto exigir confirmação.');
}
async function signInCentral(){
 if(!sb)return alert('Configure o Supabase primeiro.');
 const email=val('auth_email').trim(),password=val('auth_password');
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error)return alert('Falha no login: '+error.message);
 await smartInitialSync();
 renderAll();
}
async function signOutCentral(){
 if(sb)await sb.auth.signOut();
 currentUser=null;
 if(!data.cloudSync)data.cloudSync={};
 data.cloudSync.enabled=false;
 localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
 renderConta();
}
function scheduleCloudSync(){
 if(!sb||!currentUser||syncBusy)return;
 clearTimeout(syncTimer);
 syncTimer=setTimeout(()=>pushCloud(false),1800);
}
async function getCloudRow(){
 if(!sb||!currentUser)return null;
 const {data:row,error}=await sb.from('user_app_state').select('state,updated_at').eq('user_id',currentUser.id).maybeSingle();
 if(error)throw error;
 return row;
}
async function pushCloud(showAlert=true){
 if(!sb||!currentUser){if(showAlert)alert('Faça login para sincronizar.');return false}
 if(syncBusy)return false;
 syncBusy=true; renderConta();
 try{
   if(!data._meta)data._meta={};
   data._meta.updatedAt=data._meta.updatedAt||new Date().toISOString();
   const payload={user_id:currentUser.id,state:data,updated_at:new Date().toISOString()};
   const {error}=await sb.from('user_app_state').upsert(payload,{onConflict:'user_id'});
   if(error)throw error;
   data.cloudSync={enabled:true,lastSync:new Date().toISOString(),lastError:null};
   localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
   if(showAlert)alert('Dados enviados para a nuvem.');
   return true;
 }catch(e){
   data.cloudSync={...(data.cloudSync||{}),lastError:e.message};
   localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
   if(showAlert)alert('Erro ao enviar: '+e.message);
   return false;
 }finally{syncBusy=false;renderConta()}
}
async function pullCloud(showAlert=true){
 if(!sb||!currentUser){if(showAlert)alert('Faça login para sincronizar.');return false}
 if(syncBusy)return false;
 syncBusy=true; renderConta();
 try{
   const row=await getCloudRow();
   if(!row?.state){if(showAlert)alert('Ainda não há dados na nuvem.');return false}
   const keepCloud=row.state;
   keepCloud.cloudSync={enabled:true,lastSync:new Date().toISOString(),lastError:null};
   data=keepCloud;
   saveNoRender(true);
   if(showAlert)alert('Dados da nuvem carregados neste aparelho.');
   renderAll();
   return true;
 }catch(e){
   data.cloudSync={...(data.cloudSync||{}),lastError:e.message};
   localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
   if(showAlert)alert('Erro ao baixar: '+e.message);
   return false;
 }finally{syncBusy=false;renderConta()}
}
async function smartInitialSync(){
 if(!sb||!currentUser||syncBusy)return;
 try{
   const row=await getCloudRow();
   if(!row?.state){await pushCloud(false);return}
   const cloudTime=new Date(row.state?._meta?.updatedAt||row.updated_at||0).getTime();
   const localTime=new Date(data?._meta?.updatedAt||0).getTime();
   if(cloudTime>localTime+1500){
     const useCloud=confirm('Há dados mais recentes na nuvem. Deseja carregá-los neste aparelho?');
     if(useCloud)await pullCloud(false); else await pushCloud(false);
   }else if(localTime>cloudTime+1500){
     await pushCloud(false);
   }else{
     data.cloudSync={enabled:true,lastSync:new Date().toISOString(),lastError:null};
     localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
   }
 }catch(e){
   data.cloudSync={...(data.cloudSync||{}),lastError:e.message};
   localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
 }
}
function fmtSyncDate(x){
 if(!x)return 'Nunca';
 try{return new Date(x).toLocaleString('pt-BR')}catch{return x}
}
function renderConta(){
 const box=document.getElementById('conta'); if(!box)return;
 const cfg=getSupabaseConfig(),ready=isConfigReady(),logged=!!currentUser;
 let status=syncBusy?'Sincronizando…':logged?'Conectado':'Somente local';
 let dot=syncBusy?'busy':logged?'on':'off';
 box.innerHTML=`
 <div class="sync-status card"><span class="sync-dot ${dot}"></span><b>${status}</b>
 <span class="muted">Dispositivo: ${esc(getDeviceLabel())}</span>
 <span class="muted">Última sincronização: ${fmtSyncDate(data.cloudSync?.lastSync)}</span></div>
 <div class="auth-grid" style="margin-top:14px">
   <div class="cloud-card ${ready?'cloud-ok':'cloud-warn'}">
     <h2>1. Conexão com Supabase</h2>
     <p class="muted">A URL e a chave <b>anon/public</b> podem ficar no navegador; nunca use a service_role aqui.</p>
     <label>Project URL</label><input id="sb_url" value="${esc(cfg.url||'')}" placeholder="https://xxxx.supabase.co">
     <label style="margin-top:8px">Anon/Public key</label><textarea id="sb_key" placeholder="eyJ...">${esc(cfg.anonKey||'')}</textarea>
     <div class="row" style="margin-top:10px"><button class="btn" onclick="saveSupabaseConfig()">Salvar configuração</button><button class="btn ghost" onclick="clearSupabaseConfig()">Limpar</button></div>
   </div>
   <div class="cloud-card ${logged?'cloud-ok':'cloud-warn'}">
     <h2>2. Sua conta</h2>
     ${logged?`<p><b>${esc(currentUser.email||'Usuário conectado')}</b></p>
       <div class="row"><button class="btn" onclick="pushCloud()">Enviar para nuvem</button><button class="btn alt" onclick="pullCloud()">Baixar da nuvem</button><button class="btn ghost" onclick="signOutCentral()">Sair</button></div>`
       :`<label>E-mail</label><input id="auth_email" type="email" placeholder="seu@email.com">
         <label style="margin-top:8px">Senha</label><input id="auth_password" type="password" placeholder="mínimo 6 caracteres">
         <div class="row" style="margin-top:10px"><button class="btn" onclick="signInCentral()">Entrar</button><button class="btn alt" onclick="signUpCentral()">Criar conta</button></div>`}
   </div>
 </div>
 <div class="card" style="margin-top:14px"><h2>Como funciona</h2>
   <p><b>Sem login:</b> a Central continua funcionando e salvando neste navegador.</p>
   <p><b>Com login:</b> após mudanças, a Central tenta enviar o estado automaticamente para a nuvem. Ao abrir em outro aparelho, compara as datas e oferece carregar a versão mais nova.</p>
   <p><b>Backup manual:</b> continue usando Exportar/Importar como segunda camada de segurança.</p>
   ${data.cloudSync?.lastError?`<div class="explanation"><b>Último erro de sincronização:</b> ${esc(data.cloudSync.lastError)}</div>`:''}
 </div>`;
}
function renderPlanner(){let days=data.settings.days||['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];$('planner').innerHTML=`<div class="card"><div class="row spread"><div><h2>Planner semanal</h2><div class="small muted">É uma referência; o ciclo continua sendo o motor principal se você perder um dia.</div></div><button class="btn alt" onclick="addPlanBlock()">+ Bloco</button></div><div class="week" style="margin-top:12px">${days.map(d=>`<div class="day"><h3>${d}</h3>${(data.planner[d]||[]).map((b,i)=>`<div class="block"><b>${b.subject}</b><br>${b.minutes} min <button class="btn ghost" style="padding:3px 6px;float:right" onclick="delPlan('${d}',${i})">×</button></div>`).join('')||'<span class="small muted">Livre</span>'}</div>`).join('')}</div></div>`}
function addPlanBlock(){let d=prompt('Dia: Seg, Ter, Qua, Qui, Sex, Sáb ou Dom','Seg');if(!d)return;let s=prompt('Matéria/bloco','Português');if(!s)return;let m=+(prompt('Minutos','60')||60);if(!data.planner[d])data.planner[d]=[];data.planner[d].push({subject:s,minutes:m});save()}function delPlan(d,i){data.planner[d].splice(i,1);save()}
function renderEdital(){let opts=Object.keys(data.syllabus),selected=val('editalSelect')||opts[0];if(!data.syllabus[selected])selected=opts[0];let list=data.syllabus[selected]||[];let done=list.filter(x=>x[2]).length;$('edital').innerHTML=`<div class="card"><div class="row spread"><div><h2>Edital verticalizado</h2><div class="small muted">Itens iniciais são de planejamento. Só trate como conteúdo oficial quando o edital do concurso estiver confirmado.</div></div><select id="editalSelect" style="width:auto" onchange="renderEdital()">${opts.map(o=>`<option ${o===selected?'selected':''}>${o}</option>`).join('')}</select></div><div style="margin-top:12px"><div class="progress"><span style="width:${pct(done,list.length)}%"></span></div><div class="small muted" style="margin-top:5px">${done}/${list.length} itens concluídos</div></div>${list.map((x,i)=>`<div class="topic"><div><b>${x[0]}</b><div class="small muted">${x[1]}</div></div><span class="badge ${x[2]?'good':''}">${x[2]?'Concluído':'Pendente'}</span><button class="btn ghost" onclick="toggleSyllabus('${selected}',${i})">${x[2]?'Reabrir':'Concluir'}</button></div>`).join('')}<div class="row" style="margin-top:12px"><button class="btn alt" onclick="addSyllabus('${selected}')">+ Item</button></div></div>`}
function toggleSyllabus(c,i){data.syllabus[c][i][2]=!data.syllabus[c][i][2];save()}function addSyllabus(c){let n=prompt('Matéria/assunto');if(!n)return;let note=prompt('Observação','Item manual');data.syllabus[c].push([n,note,false]);save()}
function renderConcursos(){let rows=data.contests.map((c,i)=>`<tr><td><b>${c.org}</b><br><span class="small muted">${c.cargo}</span></td><td>${badgeStatus(c.status)}</td><td>${c.school}</td><td>${c.salary}</td><td>${c.place}</td><td>${c.exam?br(c.exam):'—'}</td><td><span class="badge">${c.priority}</span></td><td><button class="btn ghost" onclick="editContest(${i})">Editar</button></td></tr>`).join('');$('concursos').innerHTML=`<div class="card"><div class="row spread"><div><h2>Radar de concursos</h2><div class="small muted">Principal, missão e radares ficam no mesmo lugar.</div></div><button class="btn alt" onclick="addContest()">+ Concurso</button></div></div><div class="card scroll"><table><thead><tr><th>Concurso</th><th>Status</th><th>Escolaridade</th><th>Salário</th><th>Local</th><th>Prova</th><th>Prioridade</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}
function addContest(){let org=prompt('Órgão');if(!org)return;let cargo=prompt('Cargo','Nível médio');data.contests.push({org,cargo,status:'⚪ Expectativa fraca',school:'Nível médio',salary:'A definir',place:'A definir',exam:'',deadline:'',priority:'Radar',sphere:'A definir'});data.syllabus[org]=[];save()}function editContest(i){let c=data.contests[i];for(let k of ['org','cargo','status','school','salary','place','exam','deadline','priority','sphere']){let v=prompt(k,c[k]||'');if(v!==null)c[k]=v}save()}
function renderMaterias(){$('materias').innerHTML=`<div class="grid g2">${data.subjects.map((s,i)=>{let p=prio(s),done=s.topics.filter(t=>t[1]==='dominado').length;return `<div class="card"><div class="row spread"><h2>${s.name}</h2><b class="${p.cls}">${p.label} • ${p.score}</b></div><div class="progress"><span style="width:${pct(done,s.topics.length)}%"></span></div><div class="small muted" style="margin:8px 0">${p.q} questões • ${p.acc}% acertos • confiança ${s.confidence}/5 • importância ${s.importance}/5</div>${s.topics.map((t,j)=>`<div class="row spread" style="border-top:1px solid var(--line);padding:8px 0"><span>${t[0]}</span><select style="width:auto" onchange="topicStatus(${i},${j},this.value)"><option ${t[1]==='não iniciado'?'selected':''}>não iniciado</option><option ${t[1]==='estudando'?'selected':''}>estudando</option><option ${t[1]==='revisando'?'selected':''}>revisando</option><option ${t[1]==='dominado'?'selected':''}>dominado</option></select></div>`).join('')}</div>`}).join('')}</div><div class="card"><h2>Como a prioridade é calculada</h2><div class="callout">Score = importância × 20 + taxa de erro × 0,5 + (5 − confiança) × 10.</div><p class="small muted">Quanto maior o score, mais tempo a matéria merece agora. Isso é o Pareto dinâmico da Central.</p></div>`}
function topicStatus(i,j,v){data.subjects[i].topics[j][1]=v;if(v==='revisando'||v==='dominado')scheduleReviews(data.subjects[i].name,data.subjects[i].topics[j][0]);save()}function scheduleReviews(subject,topic){data.settings.review.forEach(d=>{let x=new Date();x.setDate(x.getDate()+d);let dt=x.toISOString().slice(0,10);if(!data.reviews.some(r=>r.subject===subject&&r.topic===topic&&r.date===dt))data.reviews.push({subject,topic,date:dt,type:'Active Recall + questões',status:'Pendente',result:''})})}
function renderCiclo(){$('ciclo').innerHTML=`<div class="card"><h2>Ciclo atual</h2><div class="cycle">${data.cycle.map((x,i)=>`<div class="step ${i===data.cycleIndex?'current':''}">${i+1}. <b>${x}</b>${i===data.cycleIndex?'<div class="small muted">atual</div>':''}</div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="advanceCycle()">Concluir e avançar</button><button class="btn alt" onclick="addCycle()">+ Item</button></div></div><div class="card small muted">O ciclo evita o problema de “perdi terça, perdi a matéria”. Se não estudar um dia, continue de onde parou.</div>`}function advanceCycle(){data.cycleIndex=(data.cycleIndex+1)%data.cycle.length;save()}function addCycle(){let x=prompt('Novo item');if(x){data.cycle.push(x);save()}}
function renderRevisoes(){let rows=[...data.reviews].sort((a,b)=>a.date.localeCompare(b.date)).map((r,i)=>`<tr><td>${br(r.date)}</td><td>${r.subject}</td><td>${r.topic}</td><td>${r.type||'Revisão'}</td><td>${r.status}</td><td><button class="btn ghost" onclick="doneReview(${i})">Concluir</button></td></tr>`).join('');$('revisoes').innerHTML=`<div class="card scroll"><table><thead><tr><th>Data</th><th>Matéria</th><th>Assunto</th><th>Tipo</th><th>Status</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">Nenhuma revisão agendada. Marque assuntos como revisando/dominado.</td></tr>'}</tbody></table></div>`}function doneReview(i){data.reviews[i].status='Concluída';data.reviews[i].result=prompt('Resultado: fácil, médio ou difícil','médio')||'';save()}
function renderQuestoes(){$('questoes').innerHTML=`<div class="card"><h2>Registrar questões</h2><div class="form"><div><label>Matéria</label><select id="q_sub">${data.subjects.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div><label>Assunto</label><input id="q_topic"></div><div><label>Quantidade</label><input id="q_qty" type="number"></div><div><label>Acertos</label><input id="q_hits" type="number"></div><div><label>Concurso/banca (opcional)</label><input id="q_exam"></div><div><label>Data</label><input id="q_date" type="date" value="${today()}"></div></div><div style="margin-top:10px"><button class="btn" onclick="addQuestions()">Registrar</button></div></div><div class="card scroll"><table><thead><tr><th>Data</th><th>Matéria</th><th>Assunto</th><th>Qtd.</th><th>Acertos</th><th>Erros</th><th>%</th></tr></thead><tbody>${data.questions.slice().reverse().map(q=>`<tr><td>${br(q.date)}</td><td>${q.subject}</td><td>${q.topic}</td><td>${q.qty}</td><td>${q.hits}</td><td>${q.qty-q.hits}</td><td>${pct(q.hits,q.qty)}%</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Sem registros.</td></tr>'}</tbody></table></div>`}function addQuestions(){let q=+val('q_qty'),h=+val('q_hits');if(!q||h>q)return alert('Confira os números.');data.questions.push({date:val('q_date')||today(),subject:val('q_sub'),topic:val('q_topic'),qty:q,hits:h,exam:val('q_exam')});save()}
function renderErros(){$('erros').innerHTML=`<div class="card"><h2>Novo erro</h2><div class="form"><div><label>Matéria</label><select id="e_sub">${data.subjects.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div><label>Assunto</label><input id="e_topic"></div><div><label>Erro cometido</label><textarea id="e_error"></textarea></div><div><label>Conceito correto</label><textarea id="e_correct"></textarea></div><div><label>Causa</label><select id="e_cause"><option>Conteúdo</option><option>Distração</option><option>Interpretação</option><option>Cálculo</option><option>Esquecimento</option></select></div></div><div style="margin-top:10px"><button class="btn" onclick="addError()">Adicionar</button></div></div><div class="card scroll"><table><thead><tr><th>Data</th><th>Matéria</th><th>Assunto</th><th>Erro</th><th>Correto</th><th>Causa</th><th>Revisado</th></tr></thead><tbody>${data.errors.slice().reverse().map((e,ri)=>{let idx=data.errors.length-1-ri;return `<tr><td>${br(e.date)}</td><td>${e.subject}</td><td>${e.topic}</td><td>${e.error}</td><td>${e.correct}</td><td>${e.cause}</td><td><button class="btn ghost" onclick="toggleError(${idx})">${e.reviewed?'Sim':'Não'}</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Caderno vazio.</td></tr>'}</tbody></table></div>`}function addError(){data.errors.push({date:today(),subject:val('e_sub'),topic:val('e_topic'),error:val('e_error'),correct:val('e_correct'),cause:val('e_cause'),reviewed:false});save()}function toggleError(i){data.errors[i].reviewed=!data.errors[i].reviewed;save()}
function renderSimulados(){$('simulados').innerHTML=`<div class="card"><h2>Novo simulado</h2><div class="form"><div><label>Nome</label><input id="m_name"></div><div><label>Concurso</label><input id="m_exam"></div><div><label>Questões</label><input id="m_qty" type="number"></div><div><label>Acertos</label><input id="m_hits" type="number"></div><div><label>Tempo (min)</label><input id="m_min" type="number"></div><div><label>Data</label><input id="m_date" type="date" value="${today()}"></div></div><div style="margin-top:10px"><button class="btn" onclick="addMock()">Registrar</button></div></div><div class="card scroll"><table><thead><tr><th>Data</th><th>Nome</th><th>Concurso</th><th>Questões</th><th>Acertos</th><th>%</th><th>Tempo</th></tr></thead><tbody>${data.mocks.slice().reverse().map(m=>`<tr><td>${br(m.date)}</td><td>${m.name}</td><td>${m.exam}</td><td>${m.qty}</td><td>${m.hits}</td><td>${pct(m.hits,m.qty)}%</td><td>${m.minutes} min</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nenhum simulado.</td></tr>'}</tbody></table></div>`}function addMock(){data.mocks.push({date:val('m_date')||today(),name:val('m_name'),exam:val('m_exam'),qty:+val('m_qty'),hits:+val('m_hits'),minutes:+val('m_min')});save()}
function renderDesempenho(){let st=stats(),late=data.reviews.filter(r=>r.status!=='Concluída'&&r.date<today()).length;let rows=data.subjects.map(s=>{let p=prio(s);return `<tr><td>${s.name}</td><td>${s.importance}/5</td><td>${s.confidence}/5</td><td>${p.q}</td><td>${p.acc}%</td><td>${p.score}</td><td class="${p.cls}"><b>${p.label}</b></td></tr>`}).join('');$('desempenho').innerHTML=`<div class="grid g4"><div class="card"><div class="muted">Minutos</div><div class="metric">${st.mins}</div></div><div class="card"><div class="muted">Questões</div><div class="metric">${st.q}</div></div><div class="card"><div class="muted">Acerto</div><div class="metric">${st.acc}%</div></div><div class="card"><div class="muted">Revisões atrasadas</div><div class="metric">${late}</div></div></div><div class="card"><h2>Radar Pareto</h2><div class="small muted">Score transparente: importância × 20 + taxa de erro × 0,5 + (5 − confiança) × 10.</div><div class="scroll"><table><thead><tr><th>Matéria</th><th>Importância</th><th>Confiança</th><th>Questões</th><th>Acerto</th><th>Score</th><th>Prioridade</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function renderConfig(){$('config').innerHTML=`<div class="card"><h2>Configurações</h2><div class="form"><div><label>Meta diária (min)</label><input id="s_daily" type="number" value="${data.settings.daily}"></div><div><label>Revisões (dias separados por vírgula)</label><input id="s_review" value="${data.settings.review.join(',')}"></div></div><div class="row" style="margin-top:12px"><button class="btn" onclick="saveSettings()">Salvar</button><button class="btn ghost" onclick="resetAll()">Restaurar modelo</button></div><p class="small muted">Tudo fica salvo no próprio navegador nesta fase. Use Exportar para manter um backup em JSON.</p></div><div class="card"><h2>100% gratuito</h2><p>A V5 pode funcionar gratuitamente no GitHub Pages. Enquanto não houver banco online, os registros ficam neste navegador; Exportar/Importar serve como backup e transferência entre aparelhos.</p></div>`}function saveSettings(){data.settings.daily=+val('s_daily')||60;data.settings.review=val('s_review').split(',').map(x=>+x.trim()).filter(Boolean);save()}
function toggleTheme(){data.settings.theme=data.settings.theme==='dark'?'light':'dark';save()}function applyTheme(){document.documentElement.setAttribute('data-theme',data.settings.theme||'light')}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='central-aprovacao-v5-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj.settings||!obj.contests)throw 0;data=obj;save();alert('Backup importado.')}catch{alert('Arquivo de backup inválido.')}};r.readAsText(f)}
function resetAll(){if(confirm('Apagar os dados e restaurar o modelo inicial?')){data=deepClone(baseSeed);save()}}

function showInstallHelp(){
  const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isiOS){alert('No iPhone/iPad: abra esta Central pelo Safari, toque em Compartilhar e escolha “Adicionar à Tela de Início”. Ela passará a abrir como um app.');}
  else if(window.matchMedia('(display-mode: standalone)').matches){alert('A Central já está aberta como aplicativo.');}
  else{alert('Abra o menu do navegador e escolha “Instalar aplicativo” ou “Adicionar à tela inicial”, se essa opção estiver disponível.');}
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

function renderAll(){applyTheme();renderHoje();renderAulas();renderBiblioteca();renderBanco();renderConta();renderPlanner();renderEdital();renderConcursos();renderMaterias();renderCiclo();renderRevisoes();renderQuestoes();renderErros();renderSimulados();renderDesempenho();renderConfig()}
nav();renderAll();$('subtitle').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});localStorage.setItem('centralAprovacaoV7',JSON.stringify(data));
</script>
